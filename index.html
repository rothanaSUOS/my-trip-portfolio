<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f1f6f8" />

    <!-- Unlisted: keeps the site out of search results. Anyone with the link can
         still open it — this is not access control. Paired with public/robots.txt. -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- Lets the site be added to a phone home screen and open full-screen. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Wanderlog" />
    <!-- Browser tab icon. -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>" />

    <!-- Home-screen icons. %BASE_URL% is replaced by Vite at build time with the
         deploy path (/my-trip-portfolio/), so these resolve on GitHub Pages —
         a root-absolute "/apple-touch-icon.png" would 404 under a subpath. -->
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />

    <title>Wanderlog — A Life in Trips</title>
    <meta
      name="description"
      content="A travel timeline: every trip from childhood to now, with photos, dates and places."
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Wanderlog — A Life in Trips" />
    <meta
      property="og:description"
      content="A travel timeline: every trip from childhood to now, with photos, dates and places."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
